[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "en-core-web-md",
    "fastapi[standard]>=0.141.1",
    "langdetect>=1.0.9",
    "numpy>=2.5.3",
    "pyjwt[crypto]>=2.10,<3",
    "pyphen>=0.18.1",
    "pyspellchecker>=0.9.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.6",
    "scalar-fastapi>=1.9.0",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.7",
    "sqlmodel>=0.0.47",
    "vadersentiment>=3.3.2",
]

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[tool.ruff.lint.isort]
known-first-party = ["app"]
